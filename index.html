<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>在庫QR読み取り</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0;
    }

    .message {
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    #result {
      margin: 20px auto;
      max-width: 500px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      word-break: break-all;
    }

    .success {
      color: #198754;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📷 在庫QR読み取り</h1>

  <div class="message">
    QRコードをカメラに映してください
  </div>

  <div id="reader"></div>

  <div id="result">
    QRコードを待っています…
  </div>


<script>

  // ==========================================
  // Googleフォーム
  // ==========================================

  const FORM_URL =
    "https://docs.google.com/forms/d/e/1FAIpQLSerNbY2mMFuPOy1--fW9aAPNQeHGrK75NdfRRY05qSp-ALiPg/viewform";


  // 「型式(部品ID)」の項目
  const ENTRY_ID =
    "entry.991633788";


  // ==========================================
  // QRコードを読み取ったとき
  // ==========================================

  function onScanSuccess(decodedText, decodedResult) {

    // ------------------------------------------
    // QRコードの文字を取得
    // ------------------------------------------

    let modelNumber = decodedText.trim();


    // ------------------------------------------
    // 「https://」を削除
    // ------------------------------------------

    if (modelNumber.toLowerCase().startsWith("https://")) {

      modelNumber = modelNumber.substring(8);

    }


    // ------------------------------------------
    // 「http://」も念のため削除
    // ------------------------------------------

    if (modelNumber.toLowerCase().startsWith("http://")) {

      modelNumber = modelNumber.substring(7);

    }


    // ------------------------------------------
    // 読み取り結果を画面に表示
    // ------------------------------------------

    document.getElementById("result").innerHTML =
      '<div class="success">読み取り成功！</div>' +
      '<br>' +
      '<div>型式：</div>' +
      '<strong>' + escapeHtml(modelNumber) + '</strong>' +
      '<br><br>' +
      '<div>Googleフォームを開いています…</div>';


    // ------------------------------------------
    // QRスキャナー停止
    // ------------------------------------------

    html5QrcodeScanner.clear().catch(function(error) {
      console.log(error);
    });


    // ------------------------------------------
    // GoogleフォームのURLを作成
    // ------------------------------------------

    const formUrl =
      FORM_URL +
      "?usp=pp_url&" +
      ENTRY_ID +
      "=" +
      encodeURIComponent(modelNumber);


    // ------------------------------------------
    // Googleフォームへ移動
    // ------------------------------------------

    setTimeout(function() {

      window.location.href = formUrl;

    }, 800);

  }


  // ==========================================
  // QR読み取りエラー
  // ==========================================

  function onScanFailure(error) {

    // 読み取り中のエラーは表示しません

  }


  // ==========================================
  // HTML特殊文字対策
  // ==========================================

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // ==========================================
  // QRスキャナー起動
  // ==========================================

  const html5QrcodeScanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true,

        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );


  html5QrcodeScanner.render(
    onScanSuccess,
    onScanFailure
  );

</script>

</body>

</html>
